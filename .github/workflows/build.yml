name: Release 瑞肯COA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（例如 v1.2.0 或 v1.2.0-beta.1）'
        required: true
        default: 'v0.0.0-dev'
      create_release:
        description: '是否建立 GitHub Release？'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      should_release: ${{ steps.release.outputs.value }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version"
            echo "Use vMAJOR.MINOR.PATCH, for example v1.2.0 or v1.2.0-beta.1."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Require tagged commit on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not contained in origin/main."
            echo "Push main first, then rerun this workflow. If the tag was created from the wrong commit, delete and recreate the tag from origin/main."
            exit 1
          fi

      - name: Determine release behavior
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.create_release }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python-version: ['3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile Python files
        run: python -m py_compile app.py generator.py tests/test_app.py tests/test_generator.py

      - name: Run tests
        run: python -m unittest discover -v

  build-macos:
    name: Build macOS app
    needs: [validate, test]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/build_mac.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: 瑞肯COA-${{ needs.validate.outputs.version }}-macOS
          path: release/*.dmg
          retention-days: 30

  build-windows:
    name: Build Windows app
    needs: [validate, test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build EXE
        shell: cmd
        run: scripts\build_win.bat

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\瑞肯COA\*" -DestinationPath "release\瑞肯COA_${{ needs.validate.outputs.version }}_Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 瑞肯COA-${{ needs.validate.outputs.version }}-Windows
          path: release/*.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [validate, build-macos, build-windows]
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: 瑞肯COA ${{ needs.validate.outputs.version }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
