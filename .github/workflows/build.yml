name: Build 瑞肯COA

# 觸發條件：
#   1. push v* tag（正式 release）→ 自動 build + 建立 GitHub Release
#   2. workflow_dispatch（手動觸發）→ build 並上傳 artifact，可選擇是否發佈
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本號（例如 v1.2.0）'
        required: true
        default: 'v0.0.0-dev'
      create_release:
        description: '是否建立 GitHub Release？'
        required: true
        type: boolean
        default: false

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon arm64，與本機環境一致

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 決定版本號
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # tag push：從 GITHUB_REF_NAME 取得（e.g. v1.2.0）
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝 Python 依賴
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install pyinstaller

      - name: 安裝 create-dmg
        run: brew install create-dmg

      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build_mac.sh

      - name: 上傳 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: 瑞肯COA-${{ steps.version.outputs.value }}-macOS
          path: release/*.dmg
          retention-days: 30

      # tag push 時一律建立 Release；手動觸發時由 create_release 輸入決定
      - name: 建立 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: 瑞肯COA ${{ steps.version.outputs.value }}
          files: release/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
